[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "header-grade"
version = "0.1.0"
description = "Security headers grader CLI — check any URL, get an A–F grade, and get plain-language fix suggestions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "youcefimohamed", email = "youcefimohamed@users.noreply.github.com" }]
keywords = ["security", "headers", "cli", "csp", "hsts", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    # Pydantic evaluates annotations with eval() at runtime; on Python 3.9
    # the `X | None` union syntax (Python 3.10+) raises TypeError.
    # eval_type_backport patches this so modern syntax works on 3.9.
    "eval_type_backport>=0.2.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",   # httpx mock
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
header-grade = "header_grade.cli:main"
hg = "header_grade.cli:main"  # short alias

[project.urls]
Homepage = "https://github.com/youcefimohamed/header-grade"
Repository = "https://github.com/youcefimohamed/header-grade"
Issues = "https://github.com/youcefimohamed/header-grade/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/header_grade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    # UP045: ruff wants `X | None` but Pydantic evaluates annotations at
    # runtime with eval(); on Python 3.9 that raises TypeError.
    # eval_type_backport handles it as a dep, but we keep Optional[] in
    # Pydantic models to be explicit. Remove this ignore when 3.9 is dropped.
    "UP045",
    # B008: Typer's CLI parameter declarations require function calls
    # (typer.Argument / typer.Option) in function default values.
    # This is the documented Typer pattern and cannot be avoided.
    "B008",
]

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
