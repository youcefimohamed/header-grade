name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/header_grade/

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=header_grade --cov-report=term-missing --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Smoke test: install from wheel and run against a real site
  smoke:
    name: Smoke test (install + run)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install wheel
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl

      - name: Run against example.com (minimal output — bare URL routing)
        run: header-grade example.com --format minimal

      - name: Run against example.com (explicit check subcommand)
        run: header-grade check example.com --format minimal

      - name: JSON output is valid
        run: |
          header-grade check example.com --format json | python -c "import sys,json; d=json.load(sys.stdin); assert 'grade' in d"

      - name: platforms command lists all entries
        run: |
          header-grade platforms --format json | python -c "import sys,json; d=json.load(sys.stdin); assert len(d) == 27"

      - name: fix command without platform shows menu, exits 0
        run: header-grade fix example.com || true
